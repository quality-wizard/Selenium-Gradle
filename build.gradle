 */

plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'

}

def allureVersion = "2.25.0"

tasks.register('cleanExtras') {
    doLast {
        delete 'target'
        delete 'allure-results'
    }
}

tasks.named('clean') {
    dependsOn tasks.named('cleanExtras')
}

// The version of the application.
// This can be updated as you release new versions of your application.
version = '1.0.0'

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // JUnit 5
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'

    // Cucumber + Selenium + WebDriverManager
    implementation 'io.cucumber:cucumber-java:7.26.0'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.26.0'
    testImplementation 'org.junit.platform:junit-platform-suite:1.10.0'
    implementation 'org.seleniumhq.selenium:selenium-java:4.34.0'
    implementation 'io.github.bonigarcia:webdrivermanager:6.2.0'

    // Logger backend
    // https://mvnrepository.com/artifact/ch.qos.logback/logback-classic
    testImplementation 'ch.qos.logback:logback-classic:1.4.14'

    // https://mvnrepository.com/artifact/org.seleniumhq.selenium/selenium-devtools-v138
    implementation 'org.seleniumhq.selenium:selenium-devtools-v138:4.34.0'

    // AssertJ for fluent assertions
    // https://mvnrepository.com/artifact/org.assertj/assertj-core
    testImplementation 'org.assertj:assertj-core:3.25.3'
    
    // Allure dependencies for reporting
    // Import allure-bom to ensure correct versions of all the dependencies are used
    testImplementation platform("io.qameta.allure:allure-bom:$allureVersion")
    // Add necessary Allure dependencies to dependencies section
    testImplementation "io.qameta.allure:allure-cucumber7-jvm"
    testImplementation "io.qameta.allure:allure-junit-platform"

}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()

    // Set the test logging configuration
    testLogging {
        events = ["passed", "skipped", "failed"]
        exceptionFormat = "short"
        showStandardStreams = true
    }
    
    // Set system properties for Cucumber tags filtering
    systemProperties['cucumber.filter.tags'] = System.getProperty('cucumber.filter.tags')

    doFirst {
        println ">> TAG desde consola: ${System.getProperty('cucumber.filter.tags')}"
    }
}

// Allure CLI post-processing for enriched reports
tasks.named('test') {
    finalizedBy('allureReportCLI')
}

// Prepare Allure metadata before generating the report
tasks.register('prepareAllureMetadata') {
    doLast {
        def allureResults = file("$buildDir/allure-results")

        // Crear environment.properties
        def envFile = new File(allureResults, "environment.properties")
        envFile.text = """Browser=Chrome 138
        Environment=QA
        OS=${System.getProperty('os.name')}
        """

        // Crear executor.json
        def executorJson = new File(allureResults, "executor.json")
        executorJson.text = """{
        "name": "Gradle Local",
        "type": "manual",
        "buildName": "Local Build",
        "buildOrder": 1,
        "reportName": "Allure Report Local"
        }"""

        // Copiar history si existe
        def previousHistory = file("$buildDir/allure-report/history")
        def currentHistory = new File(allureResults, "history")
        if (previousHistory.exists()) {
            copy {
                from previousHistory
                into currentHistory
            }
        }
    }
}

// Generate Allure report with Exec task (no deprecations)
tasks.register('allureReportCLI', Exec) {
    dependsOn 'prepareAllureMetadata'
    commandLine 'allure', 'generate', "$buildDir/allure-results", '--clean', '-o', "$buildDir/allure-report"
}
